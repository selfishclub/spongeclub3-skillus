<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECK_TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- stage: 16:9 default. body.a4 switches to A4 landscape ---- */
  --stage-w:1920px; --stage-h:1080px; --pad:110px;

  /* ---- type ---- */
  --font-display:"LINE Seed JP_TTF","LINE Seed Sans","Hiragino Sans","Noto Sans JP","Noto Sans KR",sans-serif;
  --font-body:"Hiragino Sans","Noto Sans JP","Noto Sans KR",-apple-system,sans-serif;
  --font-mono:Consolas,"SF Mono",ui-monospace,monospace;
  --fs-cover:76px; --fs-h1:62px; --fs-h2:32px; --fs-lead:27px;
  --fs-body:24px; --fs-small:21px; --fs-caption:17px;
  --fs-stat:50px; --fs-mega:118px;
  --lh-tight:1.32; --lh-body:1.85; --ls-body:.005em;

  /* ---- colour: LINE green + slate neutrals ---- */
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --bg:#FFFFFF; --bg-soft:#F8FAFC; --bg-ink:#0F172A; --bg-ink-2:#1E293B;
  --green:#06C755; --pink:#FF4B72; --amber:#FBBF24; --violet:#8B5CF6; --blue:#2563EB; --red:#DC2626;
  --accent:var(--green); --pos:#06C755; --neg:#DC2626;
  --tint-green:#E7F9EF; --tint-pink:#FFE9EE; --tint-amber:#FEF3C7;
  --tint-violet:#EDE9FE; --tint-blue:#DBEAFE;
  --radius:20px; --radius-sm:12px; --gap:28px;
}
body.a4{--stage-w:1414px; --stage-h:1000px; --pad:74px;
  --fs-cover:54px; --fs-h1:44px; --fs-h2:24px; --fs-lead:20px;
  --fs-body:18px; --fs-small:16px; --fs-caption:13px; --fs-stat:38px; --fs-mega:84px;}
html[lang="ko"]{
  --font-display:"LINE Seed Sans KR","LINE Seed Sans",Pretendard,"Noto Sans KR",sans-serif;
  --font-body:Pretendard,"Noto Sans KR",-apple-system,sans-serif;
  --lh-body:1.7; --ls-body:-.01em;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEF0F4;font-family:var(--font-body);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}

/* the page: soft gradient ground + white rounded panel, as in the reference */
.slide{
  width:var(--stage-w);height:var(--stage-h);position:absolute;display:none;
  transform:scale(var(--s,1));transform-origin:center center;
  background:linear-gradient(135deg,#F3EEFB 0%,#FFFFFF 42%,#EAFBF1 100%);
  padding:20px;box-shadow:0 30px 90px rgba(15,23,42,.28);
  font-size:var(--fs-body);line-height:var(--lh-body);letter-spacing:var(--ls-body);
}
.slide.on{display:block}
.panel{width:100%;height:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--pad) var(--pad) calc(var(--pad)*.72);
  display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ---- head block ---- */
.pill{display:inline-flex;align-items:center;gap:.5em;align-self:flex-start;
  font-family:var(--font-display);font-size:var(--fs-caption);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:.6em 1.15em;border-radius:999px;
  background:var(--tint-violet);color:var(--violet);margin-bottom:26px}
.pill.green{background:var(--tint-green);color:var(--accent-deep,#04913F)}
.pill.pink{background:var(--tint-pink);color:var(--pink)}
.pill.amber{background:var(--amber);color:var(--ink)}
.pill.blue{background:var(--tint-blue);color:var(--blue)}
.pill.plain{background:var(--ink);color:#fff;letter-spacing:.02em;text-transform:none}
h1{font-family:var(--font-display);font-size:var(--fs-h1);font-weight:900;
  line-height:var(--lh-tight);letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;line-height:1.4}
.lead{margin-top:18px;font-size:var(--fs-lead);line-height:1.75;color:var(--ink-2);max-width:88%}
.body{flex:1;min-height:0;margin-top:44px;display:flex;flex-direction:column;justify-content:center}

/* ---- gradient text: the reference's signature move ---- */
.grad{background-image:linear-gradient(96deg,var(--g1,#06C755) 0%,var(--g2,#2563EB) 46%,var(--g3,#8B5CF6) 78%,var(--g4,#FF4B72) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;padding-right:.06em}
.grad.warm{--g1:#FBBF24;--g2:#FF4B72;--g3:#8B5CF6;--g4:#8B5CF6}
.grad.cool{--g1:#06C755;--g2:#06C755;--g3:#2563EB;--g4:#8B5CF6}
.c-green{--c:var(--green);color:var(--green)}
.c-pink{--c:var(--pink);color:var(--pink)}
.c-amber{--c:var(--amber);color:var(--amber)}
.c-violet{--c:var(--violet);color:var(--violet)}
.c-blue{--c:var(--blue);color:var(--blue)}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.hi{background:linear-gradient(transparent 60%,var(--tint-green) 60%);font-weight:700}
strong{font-weight:700}

/* ---- foot ---- */
.pageno{position:absolute;top:var(--pad);right:var(--pad);font-family:var(--font-mono);
  font-size:var(--fs-caption);color:var(--faint);letter-spacing:.08em}
.foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-size:var(--fs-caption);color:var(--muted)}

/* ---- stat bar (dark) ---- */
.statbar{background:var(--bg-ink);border-radius:var(--radius);display:grid;
  grid-template-columns:repeat(var(--n,4),1fr);overflow:hidden}
.stat{padding:38px 30px;text-align:center;border-left:1px solid var(--bg-ink-2)}
.stat:first-child{border-left:0}
.stat .k{font-size:var(--fs-caption);color:var(--faint);margin-bottom:10px}
.stat .v{font-family:var(--font-display);font-size:var(--fs-stat);font-weight:900;
  color:var(--c,#fff);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.42em;font-weight:700;margin-left:.15em}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:var(--gap)}
.grid.fill{flex:1 1 auto;align-content:stretch;min-height:0}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:32px;display:flex;flex-direction:column;gap:12px}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .tag{font-size:var(--fs-caption);font-weight:700;padding:.4em 1em;border-radius:999px;
  background:var(--tint-green);color:var(--green)}
.card .n{font-size:var(--fs-caption);color:var(--faint)}
.card h2{font-size:var(--fs-h2)}
.card p{font-size:var(--fs-small);color:var(--muted);line-height:1.7}
.inset{margin-top:auto;background:var(--bg-soft);border-radius:10px;padding:20px 22px}
.inset .k{font-size:var(--fs-caption);font-weight:700;margin-bottom:6px}
.inset p{font-size:var(--fs-small);color:var(--ink-2)}
.card .thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;
  background:var(--bg-soft);display:block;margin-bottom:6px}
.card .thumb.contain{object-fit:contain;padding:8px}
.card.dark{background:var(--bg-ink);border-color:var(--bg-ink)}
.card.dark h2{color:var(--green)}
.card.dark p{color:#CBD5E1}
.card.dark .inset{background:var(--bg-ink-2)}
.card.dark .inset p{color:#CBD5E1}
.card.mark{border:2px solid var(--green);box-shadow:0 0 0 6px rgba(6,199,85,.12)}

/* ---- callout ---- */
.callout{margin-top:var(--gap);background:var(--tint-green);border:1px solid #A7F3D0;
  border-radius:var(--radius-sm);padding:26px 32px;text-align:center;
  font-size:var(--fs-small);font-weight:700;color:#065F46}

/* ---- bars (distributions, plan vs actual) ---- */
.bars{display:grid;gap:14px}
.bars .row{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:24px;align-items:center}
.bars .lbl{font-size:var(--fs-small);font-weight:700}
.bars .track{display:grid;grid-template-columns:1fr 120px;gap:16px;align-items:center}
.bars .b{height:26px;border-radius:6px;background:var(--c,var(--green));width:var(--v,0%);min-width:3px}
.bars .val{font-family:var(--font-display);font-size:var(--fs-small);font-weight:700;
  text-align:right;font-variant-numeric:tabular-nums}
.s1{--c:var(--green)}.s2{--c:var(--amber)}.s3{--c:var(--blue)}.s4{--c:var(--pink)}
.legend{display:flex;gap:28px;font-size:var(--fs-caption);color:var(--muted);margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c,var(--green))}
/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:var(--fs-small);font-variant-numeric:tabular-nums}
th,td{padding:16px 20px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--bg-soft);font-weight:700;color:var(--ink-2);border-bottom:2px solid var(--ink-2)}
tbody tr:last-child td{border-bottom:2px solid var(--ink-2);font-weight:700}

/* ---- dense: long tables / many rows ---- */
.slide.dense table{font-size:var(--fs-caption)}
.slide.dense th,.slide.dense td{padding:10px 14px}
.slide.dense .lead{margin-top:12px}
.slide.dense .body{margin-top:28px}
.card .thumb.short{aspect-ratio:16/6}
/* ---- images ---- */
.figs{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:22px;height:100%}
.fig{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-soft)}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.figs.contain .fig{background:var(--bg-soft);border:1px solid var(--line)}
.figs.contain .fig img{object-fit:contain;padding:16px 16px 52px}
.fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;color:#fff;
  font-size:var(--fs-caption);background:linear-gradient(transparent,rgba(0,0,0,.7))}

/* ---- timeline ---- */
.steps{display:flex;gap:0}
.step{flex:1;padding:0 26px;border-left:2px solid var(--line)}
.step:first-child{border-left:0;padding-left:0}
.step .when{font-family:var(--font-display);font-weight:900;color:var(--green);
  font-size:var(--fs-small);margin-bottom:10px}
.step p{font-size:var(--fs-small);color:var(--ink-2)}

/* ---- full-bleed variants ---- */
[data-layout="cover"] .panel{justify-content:center}
[data-layout="section"] .panel{background:var(--bg-ink);border-color:var(--bg-ink);justify-content:center}
[data-layout="section"] h1{color:#fff}
[data-layout="closing"] .panel{background:var(--bg-ink);border-color:var(--bg-ink);justify-content:center}
[data-layout="closing"] h1{color:#fff}
[data-layout="closing"] .lead{color:#94A3B8}

/* ---- chrome ---- */
#hud{position:fixed;right:22px;bottom:16px;color:#8A929B;
  font:500 14px/1 var(--font-mono);user-select:none}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--green);width:0;transition:width .25s;z-index:9}
@media print{
  @page{size:landscape;margin:0}
  body{background:#fff;overflow:visible}
  #stage{position:static;display:block}#hud,#bar{display:none}
  .slide{display:block!important;position:relative;transform:none!important;
    box-shadow:none;break-after:page;page-break-after:always}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage">

  <!-- ============ SLIDES START ============ -->

  <section class="slide on" data-layout="cover">
    <div class="panel">
      <div class="pill green">EYEBROW</div>
      <h1>1行目は黒で、<br><span class="grad">2行目をグラデーションに</span></h1>
      <p class="lead">リード文。1〜4行で、この資料が何を主張するかを述べる。</p>
      <div class="pageno"></div>
    </div>
  </section>

  <!-- ============ SLIDES END ============ -->

</div>
<div id="hud"><span id="cur">1</span> / <span id="tot">1</span></div>
<script>
const S=[...document.querySelectorAll('.slide')];let i=S.findIndex(s=>s.classList.contains('on'));if(i<0)i=0;
const fit=()=>{const cs=getComputedStyle(document.documentElement);
  const w=parseFloat(cs.getPropertyValue('--stage-w')),h=parseFloat(cs.getPropertyValue('--stage-h'));
  const s=Math.min(innerWidth/w,innerHeight/h)*0.95;
  S.forEach(el=>el.style.setProperty('--s',s));};
const show=n=>{i=Math.max(0,Math.min(S.length-1,n));
  S.forEach((el,k)=>el.classList.toggle('on',k===i));
  cur.textContent=i+1;bar.style.width=((i+1)/S.length*100)+'%';location.hash=i+1;};
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  if(e.key==='Home')show(0);if(e.key==='End')show(S.length-1);});
addEventListener('click',e=>show(e.clientX<innerWidth/2?i-1:i+1));
S.forEach((el,k)=>{const p=el.querySelector('.pageno');
  if(p)p.textContent=String(k+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');});
tot.textContent=S.length;fit();show(location.hash?parseInt(location.hash.slice(1))-1||0:i);
</script>
</body>
</html>
