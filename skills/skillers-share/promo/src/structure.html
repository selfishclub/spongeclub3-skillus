<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1600px;height:900px;background:#0a0a0c;color:#eef0ea;font-family:"Pretendard",sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
  .os{align-self:center;background:#161a0c;border:2px solid #c8f135;border-radius:18px;padding:18px 40px;text-align:center;box-shadow:0 0 40px rgba(200,241,53,.2)}
  .os .r{color:#c8f135;font-weight:800;font-size:15px;letter-spacing:.05em}
  .os .nm{font-weight:900;font-size:34px;margin-top:2px}
  .down{align-self:center;color:#55584d;font-size:26px;margin:14px 0}
  .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:34px}
  .col{background:#131417;border:1.5px solid #282c30;border-radius:16px;padding:22px 22px;text-align:center}
  .col .t{font-weight:900;font-size:24px}
  .col .s{color:#9297889;font-size:15px;margin-top:8px;color:#98a08c;line-height:1.5}
  .flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .st{background:#131417;border:1.6px solid #2b2f33;border-radius:12px;padding:13px 18px;font-weight:800;font-size:19px}
  .g{border:1.6px dashed #ff5470;border-radius:11px;padding:11px 13px;color:#ff8b8b;font-weight:900;font-size:15px}
  .a{color:#4a4e44;font-size:20px;font-weight:800}
  .flab{align-self:center;color:#98a08c;font-weight:800;font-size:16px;margin-right:6px}
</style></head><body>
  <div class="os"><div class="r">오케스트레이터 (하네스)</div><div class="nm">공유회-OS</div></div>
  <div class="down">▼ 셋을 부린다</div>
  <div class="cols">
    <div class="col"><div class="t">📚 지침</div><div class="s">질문·유형·제목·배분·대본·디자인</div></div>
    <div class="col"><div class="t">⚙️ 엔진</div><div class="s">덱 생성 · 인터넷 배포 · 노트·타이머</div></div>
    <div class="col"><div class="t">🛠 부르는 스킬</div><div class="s">훅카피 · 크리틱디렉터 · spec-guard</div></div>
  </div>
  <div class="flow"><span class="flab">흐름</span>
    <div class="st">스캔</div><div class="a">→</div>
    <div class="st">질문</div><div class="a">→</div>
    <div class="st">내용</div><div class="g">✋</div>
    <div class="st">제목</div><div class="a">→</div>
    <div class="st">목차</div><div class="g">✋</div>
    <div class="st">덱</div><div class="a">→</div>
    <div class="st">검수</div>
  </div>
</body></html>
